<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css" />
    <script src="./js/login.js" defer></script>
  </head>
  <body>
    <div class="container">
      <form class="login-form">
        <h1>Login</h1>
        <label
          >Username:
          <input required class="username" type="text" />
        </label>
        <label
          >Password:
          <input required class="password" type="password" />
        </label>
        <button class="login-btn" type="submit">Login</button>
      </form>
      <p>This project uses simulated authentication</p>
    </div>
  </body>
</html>
